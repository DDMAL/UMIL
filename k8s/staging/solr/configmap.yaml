apiVersion: v1
kind: ConfigMap
metadata:
  name: solr-core-config-staging
  namespace: umil
data:
  core.properties: |
    name=virtual-instrument-museum
  schema.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!--
     Licensed to the Apache Software Foundation (ASF) under one or more
     contributor license agreements.  See the NOTICE file distributed with
     this work for additional information regarding copyright ownership.
     The ASF licenses this file to You under the Apache License, Version 2.0
     (the "License"); you may not use this file except in compliance with
     the License.  You may obtain a copy of the License at

         http://www.apache.org/licenses/LICENSE-2.0

     Unless required by applicable law or agreed to in writing, software
     distributed under the License is distributed on an "AS IS" BASIS,
     WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
     See the License for the specific language governing permissions and
     limitations under the License.
    -->
    <schema name="virtual-instrument-museum" version="2.0">
        <field name="sid" type="string" indexed="true" stored="true" required="true" multiValued="false" />
        <uniqueKey>sid</uniqueKey>
        <field name="type" type="string" indexed="true" stored="true" required="true" multiValued="false" />
        <field name="_version_" type="long" indexed="true" stored="true" />

        <dynamicField name="*_i" type="int" indexed="true" stored="true" />
        <dynamicField name="*_is" type="int" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="*_s" type="string" indexed="true" stored="true" />
        <dynamicField name="*_ss" type="string" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="*_l" type="long" indexed="true" stored="true" />
        <dynamicField name="*_ls" type="long" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="*_t" type="text_general" indexed="true" stored="true" />
        <dynamicField name="*_t_hidden" type="text_general" indexed="true" stored="false" />
        <dynamicField name="*_txt" type="text_general" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="*_b" type="boolean" indexed="true" stored="true" />
        <dynamicField name="*_bs" type="boolean" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="*_f" type="float" indexed="true" stored="true" />
        <dynamicField name="*_fs" type="float" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="*_d" type="double" indexed="true" stored="true" />
        <dynamicField name="*_ds" type="double" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="*_dt" type="date" indexed="true" stored="true" />
        <dynamicField name="*_dts" type="date" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="ignored_*" type="ignored" multiValued="true" />
        <dynamicField name="attr_*" type="text_general" indexed="true" stored="true" multiValued="true" />
        <dynamicField name="random_*" type="random" />

        <fieldType name="string" class="solr.StrField" sortMissingLast="true" />
        <fieldType name="boolean" class="solr.BoolField" sortMissingLast="true" />
        <fieldType name="int" class="solr.IntPointField"  />
        <fieldType name="float" class="solr.FloatPointField"  />
        <fieldType name="long" class="solr.LongPointField" />
        <fieldType name="double" class="solr.DoublePointField"  />

        <fieldType name="date" class="solr.DatePointField" />
        <!--Binary data type. The data should be sent/retrieved in as Base64 encoded Strings -->
        <fieldtype name="binary" class="solr.BinaryField" />

        <fieldType name="random" class="solr.RandomSortField" indexed="true" />

        <fieldType name="text_general" class="solr.TextField" positionIncrementGap="100">
            <analyzer type="index">
                <tokenizer class="solr.StandardTokenizerFactory" />
                <filter class="solr.LowerCaseFilterFactory" />
                <filter class="solr.NGramFilterFactory" minGramSize="1" maxGramSize="15" />
            </analyzer>
            <analyzer type="query">
                <tokenizer class="solr.StandardTokenizerFactory" />
                <filter class="solr.LowerCaseFilterFactory" />
            </analyzer>
        </fieldType>
        <!-- Just like text_general except it reverses the characters of
         each token, to enable more efficient leading wildcard queries. -->
        <fieldType name="text_general_rev" class="solr.TextField" positionIncrementGap="100">
            <analyzer type="index">
                <tokenizer class="solr.StandardTokenizerFactory" />
                <filter class="solr.LowerCaseFilterFactory" />
                <filter class="solr.ReversedWildcardFilterFactory" withOriginal="true" maxPosAsterisk="3" maxPosQuestion="2" maxFractionAsterisk="0.33" />
            </analyzer>
            <analyzer type="query">
                <tokenizer class="solr.StandardTokenizerFactory" />
                <filter class="solr.LowerCaseFilterFactory" />
            </analyzer>
        </fieldType>

        <fieldtype name="ignored" stored="false" indexed="false" multiValued="true" class="solr.StrField" />

        <!-- Define the new text field for queries -->
        <field name="text" type="text_general" indexed="true" stored="true" multiValued="true"/>

        <!-- Define the field for storing the thumbnail URL -->
        <field name="thumbnail_url" type="string" stored="true" indexed="false" />

        <!-- Copy field directives for aggregating values into the text field -->
        <copyField source="wikidata_id_s" dest="text"/>
        <copyField source="*_ss" dest="text" />
    </schema>
  solrconfig.xml: |
    <?xml version="1.0" encoding="UTF-8" ?>
    <!--
     Licensed to the Apache Software Foundation (ASF) under one or more
     contributor license agreements.  See the NOTICE file distributed with
     this work for additional information regarding copyright ownership.
     The ASF licenses this file to You under the Apache License, Version 2.0
     (the "License"); you may not use this file except in compliance with
     the License.  You may obtain a copy of the License at

         http://www.apache.org/licenses/LICENSE-2.0

     Unless required by applicable law or agreed to in writing, software
     distributed under the License is distributed on an "AS IS" BASIS,
     WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
     See the License for the specific language governing permissions and
     limitations under the License.
    -->

    <config>
        <!-- Allows us to define our schema in ./schema.xml
        rather than a Solr-managed schema. -->
        <schemaFactory class="ClassicIndexSchemaFactory" />
        <luceneMatchVersion>9.4.2</luceneMatchVersion>
        <dataDir>${solr.data.dir:/var/solr}</dataDir>
        <!-- Controls how indexes are stored. The cantus_ultimus_1
        core uses the default, which combines some elements of an index
        in the filesystem and memory for performance. -->
        <directoryFactory name="DirectoryFactory" class="${solr.directoryFactory:solr.NRTCachingDirectoryFactory}"></directoryFactory>
        <indexConfig>
            <!-- Lucene's info stream is written to the solr log. -->
            <infoStream>true</infoStream>
        </indexConfig>
        <!-- TODO: Ensure that our auto commit procedure
        makes sense with the way that we are indexing our data
        (eg. the index client in the django app)-->
        <updateHandler class="solr.DirectUpdateHandler2">
            <updateLog>
                <str name="dir">${solr.ulog.dir:}</str>
                <int name="numVersionBuckets">${solr.ulog.numVersionBuckets:65536}</int>
            </updateLog>
            <autoCommit>
                <maxTime>${solr.autoCommit.maxTime:15000}</maxTime>
                <openSearcher>false</openSearcher>
            </autoCommit>
            <autoSoftCommit>
                <maxTime>${solr.autoSoftCommit.maxTime:-1}</maxTime>
            </autoSoftCommit>
        </updateHandler>

        <query>
            <maxBooleanClauses>1024</maxBooleanClauses>
            <filterCache class="solr.CaffeineCache" size="512" initialSize="512" autowarmCount="0" />
            <queryResultCache class="solr.CaffeineCache" size="512" initialSize="512" autowarmCount="0" />
            <documentCache class="solr.CaffeineCache" size="512" initialSize="512" autowarmCount="0" />
            <enableLazyFieldLoading>true</enableLazyFieldLoading>
            <queryResultWindowSize>20</queryResultWindowSize>
            <queryResultMaxDocsCached>200</queryResultMaxDocsCached>
            <useColdSearcher>false</useColdSearcher>
            <maxWarmingSearchers>2</maxWarmingSearchers>
        </query>

        <requestDispatcher handleSelect="false">
            <requestParsers multipartUploadLimitInKB="2048000" formdataUploadLimitInKB="2048" addHttpRequestToContext="false" />
            <httpCaching never304="false" />
        </requestDispatcher>

        <requestHandler name="/select" class="solr.SearchHandler">
            <lst name="defaults">
                <str name="echoParams">explicit</str>
                <int name="rows">10</int>
                <str name="df">text</str>
            </lst>
        </requestHandler>

        <!-- A request handler that returns indented JSON by default -->
        <requestHandler name="/query" class="solr.SearchHandler">
            <lst name="defaults">
                <str name="echoParams">explicit</str>
                <str name="wt">json</str>
                <str name="indent">true</str>
                <str name="df">text</str>
            </lst>
        </requestHandler>
        <initParams path="/update/**,/query,/select,/tvrh,/elevate,/spell">
            <lst name="defaults">
                <str name="df">text</str>
            </lst>
        </initParams>

    </config>